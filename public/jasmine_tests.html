<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="/jasmine-2.5.2/jasmine.css">
    <script src="/jasmine-2.5.2/jasmine.js"></script>
    <script src="/jasmine-2.5.2/jasmine-html.js"></script>
    <script src="/jasmine-2.5.2/boot.js"></script>
    <script src="/js/liste.helpers.js"></script>
    <script>
    describe('arrondi', function () {

        it('returns empty string when qty and unit are both absent', function () {
            expect(ListeHelpers.arrondi(undefined, null)).toBe('');
            expect(ListeHelpers.arrondi(null,      null)).toBe('');
        });

        it('returns unit when qty is absent but unit is present', function () {
            expect(ListeHelpers.arrondi(undefined, 'kg')).toBe('kg');
        });

        it('rounds unitless values to integer', function () {
            expect(ListeHelpers.arrondi(3,   null)).toBe(3);
            expect(ListeHelpers.arrondi(3.7, null)).toBe(4);
        });

        it('strips floating-point noise for small quantities with a unit', function () {
            expect(ListeHelpers.arrondi(1.70000000000002, 'oignons')).toBe('1.7 oignons');
            expect(ListeHelpers.arrondi(0.10000000000001, 'oignons')).toBe('0.1 oignons');
        });

        it('rounds large quantities (>10) to nearest integer', function () {
            expect(ListeHelpers.arrondi(12.9, 'oignons')).toBe('13 oignons');
            expect(ListeHelpers.arrondi(10.1, 'oignons')).toBe('10 oignons');
        });

        it('converts grams to kg above 1000g', function () {
            expect(ListeHelpers.arrondi(1500, 'g')).toBe('1.5kg');
            expect(ListeHelpers.arrondi(2300, 'g')).toBe('2.3kg');
            expect(ListeHelpers.arrondi(999,  'g')).toBe('999g');
        });

        it('converts cL to L above 100cL', function () {
            expect(ListeHelpers.arrondi(150, 'cL')).toBe('1.5L');
            expect(ListeHelpers.arrondi(75,  'cL')).toBe('75cL');
        });

        it('rounds L to integer', function () {
            expect(ListeHelpers.arrondi(3.7, 'L')).toBe('4 L');
            expect(ListeHelpers.arrondi(3,   'L')).toBe('3 L');
        });

        it('handles empty string unit (count with no label)', function () {
            expect(ListeHelpers.arrondi(5.9, '')).toBe('6');
        });
    });

    describe('addToListe', function () {

        it('scales qty by nb_gens', function () {
            var liste = [];
            ListeHelpers.addToListe(liste, {name: 'Oeufs', qty: 2, unit: ''}, 5);
            expect(liste[0].qty).toBe(10);
        });

        it('accumulates qty when the same ingredient appears twice', function () {
            var liste = [];
            ListeHelpers.addToListe(liste, {name: 'Oeufs', qty: 2, unit: ''}, 5);
            ListeHelpers.addToListe(liste, {name: 'Oeufs', qty: 1, unit: ''}, 3);
            expect(liste.length).toBe(1);
            expect(liste[0].qty).toBe(13);
        });

        it('adds different ingredients as separate entries', function () {
            var liste = [];
            ListeHelpers.addToListe(liste, {name: 'Oeufs',  qty: 2,   unit: ''},  5);
            ListeHelpers.addToListe(liste, {name: 'Farine', qty: 100, unit: 'g'}, 2);
            expect(liste.length).toBe(2);
            expect(liste[1].qty).toBe(200);
        });

        it('handles ingredient without qty (flag item)', function () {
            var liste = [];
            ListeHelpers.addToListe(liste, {name: 'Sel'}, 10);
            expect(liste[0].name).toBe('Sel');
            expect('qty' in liste[0]).toBe(false);
        });

        it('does not mutate the original ingredient object', function () {
            var ing   = {name: 'Oeufs', qty: 2, unit: ''};
            var liste = [];
            ListeHelpers.addToListe(liste, ing, 5);
            expect(ing.qty).toBe(2);
        });
    });
    </script>
</head>
</html>
